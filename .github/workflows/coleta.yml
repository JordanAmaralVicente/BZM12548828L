name: Coleta de preços

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 em Brasília
    - cron: "0 0 * * *"    # 21:00 em Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["site/**", "crawler/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Testes
        run: python -m unittest discover -s tests -t .

      - name: Coletar preços
        if: github.event_name != 'push'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m crawler.main

      - name: Só regerar o site
        if: github.event_name == 'push'
        run: python -m crawler.main --build

      - name: Salvar histórico no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "coleta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data.json
          git diff --cached --quiet || git commit -m "Coleta $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: coleta
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
